name: Build x4 Optimizer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (exe unico, nao precisa instalar .NET)
        run: >
          dotnet publish x4Optimizer.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: x4Optimizer-win-x64
          path: publish/x4Optimizer.exe
